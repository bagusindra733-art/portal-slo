/* ---------- logika evaluasi ---------- */
function testDate(p){var a=p.att.filter(function(x){return x.type==='in'}).map(function(x){return x.at.slice(0,10)}).sort();return a[0]||iso(new Date())}
function usedTools(p){var s={};Object.keys(p.form.items).forEach(function(k){var a=p.form.items[k].alat;if(a)s[a]=1});return Object.keys(s)}
function checks(p){
  var team=(p.team?p.team.ins:[]).map(I).filter(Boolean),tests=TESTS[p.jenis],td=testDate(p),r=[];
  var filled=tests.every(function(t){var x=p.form.items[t[0]];return x&&x.hasil&&x.alat});
  r.push({t:'LHPP: seluruh mata uji terisi (hasil + alat) dan dikirim',ok:p.form.submitted&&filled});
  var miss=team.filter(function(i){return!p.att.some(function(a){return a.ins===i.id&&a.type==='in'})||!p.att.some(function(a){return a.ins===i.id&&a.type==='out'})});
  var sim=p.att.filter(function(a){return a.mode!=='live'}).length;
  r.push({t:'Absensi selfie masuk dan pulang seluruh anggota tim',ok:team.length>0&&!miss.length,note:(miss.length?'Belum lengkap: '+miss.map(function(i){return i.nama}).join(', '):'')+(sim?(miss.length?' · ':'')+sim+' foto mode simulasi (bukan GPS asli)':'')});
  var badI=team.filter(function(i){return i.serkom<td||i.k3<td});
  r.push({t:'Serkom TTK dan sertifikat K3 inspektor berlaku pada tanggal uji ('+fmtD(td)+')',ok:team.length>0&&!badI.length,note:badI.map(function(i){return i.nama}).join(', ')});
  var ut=usedTools(p),badT=ut.map(TL).filter(function(t){return!t||t.cal<td});
  r.push({t:'Kalibrasi alat yang dipakai berlaku pada tanggal uji',ok:ut.length>0&&!badT.length,note:badT.map(function(t){return t&&t.nama}).join(', ')});
  r.push({t:'Paket dokumen (JSA, Surat Tugas, Surat Jalan, SPK/SPD) terbit dan dikonfirmasi',ok:p.docs.issued&&p.docs.ack});
  var open=p.finds.filter(function(f){return f.st==='open'}).length;
  r.push({t:'Seluruh temuan ketidaksesuaian sudah ditutup klien',ok:!open,note:open?open+' temuan terbuka':''});
  r.push({t:'BAP bertanda tangan digital terunggah',ok:!!p.bap});
  return r;
}

  showModal('<div class="mh"><h3>'+(type==='in'?'Absensi masuk':'Absensi pulang')+'</h3><button class="btn sm" data-a="closeModal">Tutup</button></div><div class="cam"><video id="vid" playsinline muted autoplay></video></div><p id="camst" class="muted">Menyiapkan kamera dan GPS…</p><div class="row"><button class="btn pri" id="snap" data-a="snap" disabled>Ambil foto</button><button class="btn" id="sim" data-a="sim" hidden>Gunakan mode simulasi (demo)</button></div>');
  var me=ui.cam={pid:pid,type:type,stream:null,pos:null};
  var gps=new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(res,function(){res(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:0})});
  var cam=Promise.resolve().then(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})}).catch(function(){return null});
  Promise.all([cam,gps]).then(function(r){
    if(ui.cam!==me){if(r[0])r[0].getTracks().forEach(function(t){t.stop()});return}
    me.stream=r[0];me.pos=r[1];var st=$('#camst');if(!st)return;
    if(r[0])$('#vid').srcObject=r[0];
    if(r[0]&&r[1]){st.textContent='Kamera dan GPS siap (akurasi ±'+Math.round(r[1].coords.accuracy)+' m).';$('#snap').disabled=false}
    else{st.innerHTML='<b>'+(r[0]?'GPS':r[1]?'Kamera':'Kamera dan GPS')+' tidak tersedia di tampilan ini.</b> Absensi asli memerlukan kamera langsung dan GPS (foto galeri ditolak). Buka aplikasi sebagai situs mandiri di HP, atau gunakan mode simulasi untuk mencoba alur.';$('#sim').hidden=false}
  });
}
function doSnap(sim){
  var me=ui.cam;if(!me)return;var p=P(me.pid),ins=I(ui.ins),c=document.createElement('canvas'),ctx,w=640,h=480;
  c.width=w;c.height=h;ctx=c.getContext('2d');
  if(sim){ctx.fillStyle='#3a4a5c';ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff';ctx.font='600 26px sans-serif';ctx.fillText('SIMULASI — tanpa kamera',150,200)}
  else{var v=$('#vid');ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(v,0,0,w,h);ctx.setTransform(1,0,0,1,0,0)}
  var pos=sim?null:me.pos,now=new Date();
  wm(ctx,w,h,[ins.nama+' · '+(me.type==='in'?'CHECK-IN':'CHECK-OUT'),p.perusahaan+' — '+p.kota,fmtDT(now),pos?'GPS '+pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6)+' (±'+Math.round(pos.coords.accuracy)+' m)':'GPS tidak tersedia (simulasi)']);
  var q=0.8,u=c.toDataURL('image/jpeg',q);while(u.length*0.75>MAXB&&q>0.3){q-=0.1;u=c.toDataURL('image/jpeg',q)}
  snapRecord(p,me.type,ins.id,u,pos,sim?'sim':'live');
}
